name: codesense review
description: >-
  用 codesense CLI 跑代码评审(diff / 全文件扫描),输出 findings 计数与会话 id,
  退出码沿用 CLI 门禁语义(0=无 blocker,1=有 blocker 或运行错误,2=用法/配置错)。
  前置:运行器上已有 codesense 可执行文件(本仓示例:PATH 指向 node_modules/.bin 且已 build)。
branding:
  icon: eye
  color: purple

inputs:
  cli:
    description: codesense 可执行文件路径/命令名(默认 PATH 中的 codesense)。
    required: false
    default: codesense
  root:
    description: 仓库根(传给 --root;默认当前工作目录)。
    required: false
    default: "."
  target:
    description: diff 目标(commit hash / 分支名;留空=未提交变更)。scan 模式忽略。
    required: false
    default: ""
  scan:
    description: 全文件扫描。true=全仓;也可填仓内路径(目录或文件,如 src/ 或 src/a.ts)。
    required: false
    default: "false"
  include:
    description: scan 白名单 glob(逗号分隔,如 "*.ts,*.py")。
    required: false
    default: ""
  exclude:
    description: scan 额外黑名单 glob(逗号分隔,如 "**/fixtures/**")。
    required: false
    default: ""
  deep:
    description: LLM 深审(true/false)。凭证经 env 注入(GENIE_LLM_* 或 --base-url 等)。
    required: false
    default: "false"
  rounds:
    description: 深审轮数(≥1;留空=引擎缺省 2)。
    required: false
    default: ""
  max-files:
    description: scan 文件数上限(留空=200)。
    required: false
    default: ""
  max-tokens:
    description: scan 深审总 token 预算(留空=120000)。
    required: false
    default: ""
  max-file-size:
    description: scan 单文件字节上限(留空=131072;超出截断并登记)。
    required: false
    default: ""
  extra-args:
    description: 追加参数(按空白切分,如 "--no-color";不要放含空格的值)。
    required: false
    default: ""

outputs:
  findings:
    description: findings 总数。
    value: ${{ steps.review.outputs.findings }}
  blockers:
    description: blocker 条数。
    value: ${{ steps.review.outputs.blockers }}
  warnings:
    description: warning 条数。
    value: ${{ steps.review.outputs.warnings }}
  nits:
    description: nit 条数。
    value: ${{ steps.review.outputs.nits }}
  session:
    description: 本次评审会话 id(可用于 --resume/--compare)。
    value: ${{ steps.review.outputs.session }}
  exit-code:
    description: CLI 退出码(0/1/2)。
    value: ${{ steps.review.outputs['exit-code'] }}

runs:
  using: composite
  steps:
    - id: review
      shell: bash
      env:
        INPUT_CLI: ${{ inputs.cli }}
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_SCAN: ${{ inputs.scan }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_DEEP: ${{ inputs.deep }}
        INPUT_ROUNDS: ${{ inputs.rounds }}
        INPUT_MAX_FILES: ${{ inputs['max-files'] }}
        INPUT_MAX_TOKENS: ${{ inputs['max-tokens'] }}
        INPUT_MAX_FILE_SIZE: ${{ inputs['max-file-size'] }}
        INPUT_EXTRA_ARGS: ${{ inputs['extra-args'] }}
      run: |
        set +e
        out="${RUNNER_TEMP:-/tmp}/codesense-review-$$.json"
        args=(review)
        if [ -n "$INPUT_ROOT" ]; then args+=(--root "$INPUT_ROOT"); fi
        scan_on=false
        case "$INPUT_SCAN" in
          ""|false|False|FALSE) ;;
          true|True|TRUE) scan_on=true; args+=(--scan) ;;
          *) scan_on=true; args+=(--scan "$INPUT_SCAN") ;;
        esac
        # scan 模式忽略 target(否则位置参数会被 CLI 当作 scan path)
        if [ -n "$INPUT_TARGET" ] && [ "$scan_on" != true ]; then args+=("$INPUT_TARGET"); fi
        if [ -n "$INPUT_INCLUDE" ]; then args+=(--include "$INPUT_INCLUDE"); fi
        if [ -n "$INPUT_EXCLUDE" ]; then args+=(--exclude "$INPUT_EXCLUDE"); fi
        case "$INPUT_DEEP" in
          true|True|TRUE) args+=(--deep) ;;
        esac
        if [ -n "$INPUT_ROUNDS" ]; then args+=(--rounds "$INPUT_ROUNDS"); fi
        if [ -n "$INPUT_MAX_FILES" ]; then args+=(--max-files "$INPUT_MAX_FILES"); fi
        if [ -n "$INPUT_MAX_TOKENS" ]; then args+=(--max-tokens "$INPUT_MAX_TOKENS"); fi
        if [ -n "$INPUT_MAX_FILE_SIZE" ]; then args+=(--max-file-size "$INPUT_MAX_FILE_SIZE"); fi
        if [ -n "$INPUT_EXTRA_ARGS" ]; then
          read -r -a extra <<< "$INPUT_EXTRA_ARGS"
          args+=("${extra[@]}")
        fi

        "$INPUT_CLI" "${args[@]}" --json > "$out"
        code=$?
        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        else
          echo "exit-code=$code"
        fi

        if [ -s "$out" ]; then
          node - "$out" <<'NODE'
        const fs = require("node:fs");
        const file = process.argv[2];
        let j;
        try {
          j = JSON.parse(fs.readFileSync(file, "utf8"));
        } catch (e) {
          console.log(`[codesense-review] 无法解析 JSON 输出: ${e.message}`);
          process.exit(0);
        }
        const c = j.counts || {};
        const counts = {
          findings: c.total ?? (j.findings ? j.findings.length : 0),
          blockers: c.blocker ?? 0,
          warnings: c.warning ?? 0,
          nits: c.nit ?? 0,
          session: j.session && j.session.id ? j.session.id : "",
        };
        const out = process.env.GITHUB_OUTPUT;
        if (out) {
          fs.appendFileSync(out, Object.entries(counts).map(([k, v]) => `${k}=${v}`).join("\n") + "\n");
        }
        const md = [];
        md.push("## codesense review");
        md.push("");
        md.push(`- 目标: \`${(j.target && j.target.kind) || "?"}\` · ${(j.target && j.target.files && j.target.files.length) || 0} 文件 · ${(j.target && j.target.totalLines) || 0} 行`);
        if (j.scanDeep) {
          md.push(`- scan 深审: ${j.scanDeep.batches} 批 / ${j.scanDeep.filesReviewed} 文件 / ${j.scanDeep.estimatedTokens} tokens${j.scanDeep.filesSkippedByBudget ? ` / 预算跳过 ${j.scanDeep.filesSkippedByBudget} 文件` : ""}`);
        }
        md.push(`- 结论: blocker ${counts.blockers} / warning ${counts.warnings} / nit ${counts.nits}${counts.session ? ` · 会话 \`${counts.session}\`` : ""}`);
        if (j.compare && j.compare.counts) {
          const k = j.compare.counts;
          md.push(`- 对比基线 \`${j.compare.baseline}\`: 新增 ${k.new} / 已修复 ${k.resolved} / 未变 ${k.unchanged} / 复现 ${k.reappeared}`);
        }
        const findings = Array.isArray(j.findings) ? j.findings : [];
        if (findings.length) {
          md.push("");
          md.push("| severity | file:line | title |");
          md.push("|---|---|---|");
          for (const f of findings.slice(0, 30)) {
            const title = String(f.title || "").replace(/\|/g, "\\|").slice(0, 120);
            md.push(`| ${f.severity || ""} | \`${String(f.file || "").replace(/\|/g, "\\|")}:${f.line || 0}\` | ${title} |`);
          }
          if (findings.length > 30) md.push(`| … | | 另外 ${findings.length - 30} 条(见作业日志 JSON) |`);
        }
        const text = md.join("\n") + "\n";
        console.log(text);
        if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text);
        NODE
        else
          echo "[codesense-review] CLI 未产生 JSON 输出(exit $code)"
        fi

        rm -f "$out"
        exit "$code"

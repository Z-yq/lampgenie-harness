# 门禁 CI( D3):凭证红线→审计对账→构建→测试→类型检查。
# 本地等价跑法:pnpm gate(build 含在 test/typecheck 前,见 steps)。
name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 凭证红线(cred-gate)
        run: pnpm gate:creds
      - name: 审计对账(audit-reconcile)
        run: pnpm gate:audit
      - name: 构建(依赖包先行:core/protocol → 全仓)
        run: pnpm -r run build
      - name: 测试
        id: test
        run: |
          set -o pipefail
          pnpm -r run test 2>&1 | tee /tmp/test-output.log
      - name: 失败摘要(失败清单进 step summary,便于远端审计)
        if: failure() && steps.test.outcome == 'failure'
        run: |
          {
            echo "## 测试失败清单"
            grep -E "^ FAIL |Tests  |Test Files " /tmp/test-output.log | head -120 || true
            echo "## 末段输出"
            tail -40 /tmp/test-output.log || true
          } >> "${GITHUB_STEP_SUMMARY}"
          sed 's/\x1b\[[0-9;]*m//g' /tmp/test-output.log > /tmp/test-clean.log || cp /tmp/test-output.log /tmp/test-clean.log
          grep -E "FAIL +test/" /tmp/test-clean.log | sed 's/.*FAIL */FAIL /' | sort -u | head -45 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -E "(→|AssertionError)" /tmp/test-clean.log | head -45 | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done
          grep -E "Tests +[0-9]+ failed" /tmp/test-clean.log | head -6 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: 类型检查
        run: pnpm -r run typecheck

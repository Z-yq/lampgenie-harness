# 门禁 CI( D3):凭证红线→审计对账→构建→测试→类型检查。
# 本地等价跑法:pnpm gate(build 含在 test/typecheck 前,见 steps)。
name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 凭证红线(cred-gate)
        run: pnpm gate:creds
      - name: 审计对账(audit-reconcile)
        run: pnpm gate:audit
      - name: 构建(依赖包先行:core/protocol → 全仓)
        run: pnpm -r run build
      - name: git 身份(测试夹具仓需要 commit;runner 默认无身份,缺失会让夹具提交静默失败)
        run: |
          git config --global user.name "ci-fixture"
          git config --global user.email "ci-fixture@example.com"
      - name: ripgrep(sensing 扫描器 rg-first;ubuntu-26 镜像不再预装)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: 测试
        id: test
        run: |
          set -o pipefail
          pnpm -r run test 2>&1 | tee /tmp/test-output.log
      - name: 失败摘要(失败清单进 step summary,便于远端审计)
        if: failure() && steps.test.outcome == 'failure'
        run: |
          {
            echo "## 测试失败清单"
            grep -E "^ FAIL |Tests  |Test Files " /tmp/test-output.log | head -120 || true
            echo "## 末段输出"
            tail -40 /tmp/test-output.log || true
          } >> "${GITHUB_STEP_SUMMARY}"
          sed 's/\x1b\[[0-9;]*m//g' /tmp/test-output.log > /tmp/test-clean.log || cp /tmp/test-output.log /tmp/test-clean.log
          # 完整失败清单打进单条注解(绕过注解条数上限;换行 %0A 编码)
          FAILS=$(grep -E "FAIL +test/" /tmp/test-clean.log | sed 's/.*FAIL +*/FAIL /' | sort -u | head -60 | cut -c1-180)
          ASSERTS=$(grep -E "AssertionError" /tmp/test-clean.log | grep -vE "node:internal|node_modules" | head -60 | cut -c1-260)
          HARN=$(grep -E "harness-workflow test:" /tmp/test-clean.log | grep -E "AssertionError|→ expected|×|FAIL " | head -30 | cut -c1-260)
          LIST="$FAILS
          === ASSERTIONS ===
          $ASSERTS"
          if [ -n "$FAILS" ]; then
          ENC=$(printf '%s' "$LIST" | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-28000)
          N=$(( ( ${#ENC} + 2999 ) / 3000 ))
          for i in $(seq 0 $(( N - 1 ))); do
            CHUNK=$(printf '%s' "$ENC" | cut -c$(( i * 3000 + 1 ))-$(( i * 3000 + 3000 )))
            echo "::error::[chunk $(( i + 1 ))/$N] $CHUNK"
          done
          fi
          # 兜底:无 FAIL 行也失败时(如 worker 崩溃/超时/非 vitest 报错),把末段输出原样上报
          if [ -z "$FAILS" ]; then
          TAIL=$(tail -c 6000 /tmp/test-clean.log | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-5900)
          echo "::error::[tail] $TAIL"
          fi
          grep -E "Tests +[0-9]+ failed" /tmp/test-clean.log | head -6 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: 类型检查
        run: pnpm -r run typecheck
